# 短剧生产工作台 —— 全栈一键部署(postgres + 后端 + 前端)。
# 用法:  make deploy        (= docker compose -f docker-compose.deploy.yml up -d --build)
# 访问:  前端 http://localhost:3000   后端 http://localhost:8080   登录 admin/admin
#
# LLM Key 可选:在仓库根目录放一个 .env(例如 GEMINI_API_KEY=xxx),compose 会自动读取。
# 全部留空 = 后端走无 Key 演示模式(DemoMock),仍返回完整中文示例方案。
#
# 注意:这是独立于 docker-compose.yml(仅 DB,供本地开发)的全栈部署文件,二者请勿同时启动。
name: drama

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drama
      POSTGRES_PASSWORD: drama
      POSTGRES_DB: drama
    volumes:
      - drama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama -d drama"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      # 容器内连库用服务名 postgres(非 localhost)
      DATABASE_URL: postgres://drama:drama@postgres:5432/drama?sslmode=disable
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin}
      # ── LLM Provider(留空 = DemoMock 演示);把 key 放进根目录 .env 即可 ──
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      # ── Vertex(可选,唯一支持出图):取消下方 volumes 注释挂载 SA 文件,
      #    并设 VERTEX_CREDENTIALS_FILE=/secrets/vertex-sa.json ──
      VERTEX_CREDENTIALS_FILE: ${VERTEX_CREDENTIALS_FILE:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      IMAGEN_MODEL: ${IMAGEN_MODEL:-imagen-3.0-generate-002}
    # volumes:
    #   - ./backend/vertex-sa.json:/secrets/vertex-sa.json:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问后端的地址(构建期注入 bundle,须浏览器可达;非 compose 内部服务名)。
        # 后端发布在别的主机/端口时,部署前 export NEXT_PUBLIC_API=http://<host>:8080。
        NEXT_PUBLIC_API: ${NEXT_PUBLIC_API:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # 可选数据库浏览器(http://localhost:8082):docker compose -f docker-compose.deploy.yml --profile tools up -d
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  drama_pg_data:
